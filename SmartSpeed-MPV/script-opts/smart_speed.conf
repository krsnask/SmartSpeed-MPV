# SmartSpeed-MPV configuration

# Speed while subtitles/dialogue are active
dialogue_speed=2.0

# Speed during long subtitle gaps
silence_speed=4.0

# Only use silence_speed when the gap is longer than this many seconds
minimum_gap=3.0

# Return to dialogue speed this many seconds before the next subtitle starts
early_switch=0.20

# How often playback position is checked
poll_interval=0.05

# Start enabled
enabled=yes

# Show on-screen messages
show_osd=yes

# Print detailed transition information to the MPV log
debug=no

# Restore playback speed to 1.0x when SmartSpeed is disabled
restore_speed_when_disabled=yes
